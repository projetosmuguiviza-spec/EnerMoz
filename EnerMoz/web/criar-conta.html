<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnerMoz | Criar conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body" data-page="register">
  <main class="auth-layout">
    <section class="auth-panel">
      <a class="auth-brand" href="entrar.html" aria-label="EnerMoz">
        <span class="brand-icon">
          <img src="https://cdn-icons-png.flaticon.com/512/702/702814.png" alt="">
        </span>
        <span>
          <strong>EnerMoz</strong>
          <small>Gestão de energia residencial</small>
        </span>
      </a>

      <form id="signupForm" class="auth-form active">
        <div class="auth-heading">
          <span class="small-label">Nova conta</span>
          <h1>Criar conta</h1>
          <p>Preencha com os dados da sua casa.</p>
        </div>

        <label>Nome
          <span class="input-with-icon">
            <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" alt="">
            <input id="signupName" autocomplete="name" placeholder="Ex: Mauro Artur Muguiviza" required>
          </span>
        </label>
        <label>Email
          <span class="input-with-icon">
            <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="">
            <input id="signupEmail" type="email" autocomplete="email" required>
          </span>
        </label>
        <label>Residencia
          <span class="input-with-icon">
            <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png" alt="">
            <input id="signupHome" placeholder="Ex: Muguiviza's House" required>
          </span>
        </label>
        <label>Palavra-passe
          <span class="input-with-icon">
            <img src="https://cdn-icons-png.flaticon.com/512/565/565547.png" alt="">
            <input id="signupPassword" type="password" minlength="4" autocomplete="new-password" required>
          </span>
        </label>

        <button class="primary auth-submit" type="submit">Criar conta</button>
        <p class="auth-switch">Ja tem conta? <a href="entrar.html">Entrar</a></p>
      </form>

      <div id="authMessage" class="auth-message" aria-live="polite"></div>
    </section>

    <aside class="auth-photo">
      <img src="images/fotoLogin.jpg" alt="Residencia familiar">
      <div>
        <span>EnerMoz</span>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
