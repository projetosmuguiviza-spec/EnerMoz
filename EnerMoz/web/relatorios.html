<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnerMoz | Relatórios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="reports">
  <aside class="sidebar"></aside>
  <main class="page-shell">
    <header class="page-top"></header>
    <article class="panel">
      <div class="panel-head">
        <h2>Relatório energético</h2>
        <div class="report-actions">
          <button class="soft-button compact" id="copyReport" type="button">Copiar</button>
          <button class="primary compact" id="downloadReport" type="button">Baixar PDF</button>
        </div>
      </div>
      <div id="reportContent" class="report-content"></div>
    </article>
  </main>
  <script src="app.js"></script>
</body>
</html>
